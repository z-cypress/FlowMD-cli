name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flowmd_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowmd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      FLOW_TEST_MYSQL_HOST: localhost
      FLOW_TEST_MYSQL_PORT: 3306
      FLOW_TEST_MYSQL_USER: root
      FLOW_TEST_MYSQL_PASSWORD: root
      FLOW_TEST_MYSQL_DATABASE: flowmd_test
      FLOW_TEST_PG_HOST: localhost
      FLOW_TEST_PG_PORT: 5432
      FLOW_TEST_PG_USER: postgres
      FLOW_TEST_PG_PASSWORD: postgres
      FLOW_TEST_PG_DATABASE: flowmd_test

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v2
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm --version && node --version && ls -la pnpm-lock.yaml && head -3 pnpm-lock.yaml
      - run: pnpm install 2>&1 || true
      - run: pnpm install --no-frozen-lockfile 2>&1 || true
      - run: npm install 2>&1 | tail -5 || true
      - run: mysql -h127.0.0.1 -uroot -proot flowmd_test -e "CREATE TABLE IF NOT EXISTS users (id INT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(255), email VARCHAR(255)); INSERT IGNORE INTO users (name, email) VALUES ('Alice', 'alice@example.com'), ('Bob', 'bob@example.com');"
      - run: PGPASSWORD=postgres psql -h127.0.0.1 -Upostgres flowmd_test -c "CREATE TABLE IF NOT EXISTS users (id SERIAL PRIMARY KEY, name VARCHAR(255), email VARCHAR(255)); INSERT INTO users (name, email) VALUES ('Alice', 'alice@example.com'), ('Bob', 'bob@example.com') ON CONFLICT DO NOTHING;"
      - run: pnpm typecheck
      - run: pnpm test:run
